# CI mínimo: todo commit empurrado roda os testes do backend (com Postgres real, só o LLM é mockado)
# e os testes + build do frontend. Dois jobs independentes, em paralelo.
# Lint fica de fora de propósito (pedido do chefe: só testes e build).
name: CI

on:
  push:
  workflow_dispatch:

# Commit novo na mesma branch cancela a rodada anterior que ainda estava rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      # Postgres efêmero do próprio runner. Mesmo usuário/senha do docker-compose do projeto; o conftest
      # cria um banco `<banco>_test` dentro dele, então o `hub` precisa poder criar banco (POSTGRES_USER é superusuário).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub_agentes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub_agentes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hub:hub@localhost:5432/hub_agentes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Frontend (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
